# Shared by Flash, Run and Cortex-Debug. These are debugger connection settings,
# not a replacement for CubeMX's peripheral or application clock configuration.
source [find interface/stlink.cfg]
transport select swd
source [find target/stm32f7x.cfg]

# Set these after the target script, which otherwise requests 2000 kHz.
# Retain the existing probe speed; lower speed alone did not fix examination.
adapter speed 1800

# The board was only examinable while held in hardware reset.
# This requires the onboard ST-LINK's NRST connection to remain intact.
reset_config srst_only srst_nogate connect_assert_srst
