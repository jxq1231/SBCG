name: Host checks

on:
  push:
    paths:
      - 'Tools/Monitor/**'
      - '.vscode/**'
      - '.github/workflows/host-checks.yml'
  pull_request:
    paths:
      - 'Tools/Monitor/**'
      - '.vscode/**'
      - '.github/workflows/host-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tools:
    name: Python tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test host diagnostic tools without hardware
        run: python -B -m unittest discover -s Tools/Monitor/tests -v
      - name: Check VS Code JSON syntax
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('.vscode').glob('*.json')]"
